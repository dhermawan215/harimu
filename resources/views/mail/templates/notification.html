<!-- Fragment generik untuk {{content}} pada layout.html
     Token: {{heading}}, {{name}}, {{message}}, {{action_url}}, {{action_label}}
     Hapus blok tombol jika tidak ada aksi. Salin blok "box" untuk kode OTP / ringkasan. -->
<h1 class="h1" style="margin:0 0 12px; font-size:26px; line-height:34px; font-weight:700; color:#2b2530;">{{heading}}</h1>

<p class="text" style="margin:0 0 16px; font-size:15px; line-height:24px; color:#4a424d;">Halo {{name}},</p>
<p class="text" style="margin:0 0 24px; font-size:15px; line-height:24px; color:#4a424d;">{{message}}</p>

<!-- Kotak sorotan (opsional): kode OTP, nomor pesanan, ringkasan singkat -->
<table role="presentation" class="box" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#faf5f2" style="background-color:#faf5f2; border:1px solid #efe4de; border-radius:8px; margin:0 0 24px;">
    <tr>
        <td align="center" style="padding:20px;">
            <span class="code" style="font-family:'Courier New', Courier, monospace; font-size:28px; line-height:36px; font-weight:700; letter-spacing:8px; color:#2b2530;">{{highlight}}</span>
        </td>
    </tr>
</table>

<!-- Tombol aksi (opsional) -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px;">
    <tr>
        <td class="btn-cell" bgcolor="#b76e79" style="border-radius:8px; background-color:#b76e79;">
            <a href="{{action_url}}" class="btn" style="display:inline-block; padding:14px 32px; font-size:15px; line-height:20px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:8px;">{{action_label}}</a>
        </td>
    </tr>
</table>
